[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insane-qwen"
version = "0.1.0"
description = "Private Qwen3.5 neuron steering, comparison and offline discovery"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.11,<4"]

[project.optional-dependencies]
gpu = ["torch>=2.10,<2.14", "transformers==5.17.0", "accelerate>=1.0", "numpy>=2,<3"]
fla = ["fla-core==0.6.0", "flash-linear-attention==0.6.0"]
agent = ["vllm==0.31.0"]

[project.scripts]
insane-qwen-serve = "insane_qwen.server:main"
insane-qwen-web = "insane_qwen.gateway:main"
insane-qwen-scan = "insane_qwen.scan:main"

[tool.setuptools.package-data]
insane_qwen = ["web/*", "calibration.json"]
